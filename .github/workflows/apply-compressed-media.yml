name: Apply compressed media (preview branch only)
on:
  push:
    branches:
      - 'preview/compress-media-nov16'
    paths:
      - '.github/workflows/apply-compressed-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/preview/compress-media-nov16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Decode staging chunks and replace media in place
        run: |
          python3 <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path

          staging = Path('.compress-staging')
          manifest_path = staging / 'MANIFEST.json'
          if not manifest_path.exists():
              sys.exit('MANIFEST.json missing; refusing to continue')
          manifest = json.loads(manifest_path.read_text())
          forbidden = {'forestry-mulching-original-1080p.mp4'}
          written = []
          for rec in manifest:
              dest = Path(rec['dest'])
              if dest.name in forbidden or rec['name'] in forbidden:
                  sys.exit(f'refusing to touch {dest}')
              if dest.suffix.lower() not in {'.mp4', '.jpg', '.jpeg'}:
                  sys.exit(f'unexpected destination {dest}')
              parts = sorted(staging.glob(rec['name'] + '.part*.b64'))
              if len(parts) != rec['parts']:
                  sys.exit(f"{rec['name']}: expected {rec['parts']} parts, found {len(parts)}")
              b64 = ''.join(part.read_text().split() for part in parts)
              data = base64.b64decode(b64, validate=True)
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != rec['bytes'] or digest != rec['sha256']:
                  sys.exit(f"{rec['name']}: size/hash mismatch got {len(data)} {digest}")
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              written.append(f"{dest} {len(data)} {digest}")
          Path('/tmp/written.txt').write_text(chr(10).join(written) + chr(10))
          print(chr(10).join(written))
          PY
      - name: Commit replacements and remove staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            hero4.mp4 \
            henson_timelapse_HD_sharp_24MB.mp4 \
            henson_second_mulching_normal_speed.mp4 \
            img/IMG_20261008_155509.jpg \
            img/IMG_20261008_155442.jpg \
            img/IMG_20261009_092059.jpg
          git rm -r --ignore-unmatch .compress-staging
          git rm --ignore-unmatch .github/workflows/apply-compressed-media.yml
          echo "==== cached diff stat ===="
          git diff --cached --stat
          echo "==== unstaged / untracked (should be empty except maybe workflow leftovers) ===="
          git status --short
          # Fail if any HTML or unexpected path is staged
          python3 - <<'PY'
          import subprocess, sys
          out = subprocess.check_output(['git','diff','--cached','--name-only'], text=True)
          allowed = {
            'hero4.mp4',
            'henson_timelapse_HD_sharp_24MB.mp4',
            'henson_second_mulching_normal_speed.mp4',
            'img/IMG_20261008_155509.jpg',
            'img/IMG_20261008_155442.jpg',
            'img/IMG_20261009_092059.jpg',
            '.github/workflows/apply-compressed-media.yml',
          }
          bad = []
          for line in out.splitlines():
              path = line.strip()
              if not path:
                  continue
              if path.startswith('.compress-staging/'):
                  continue
              if path not in allowed:
                  bad.append(path)
          if bad:
              sys.exit('unexpected staged paths: ' + ', '.join(bad))
          PY
          git commit -m "Compress homepage videos and forestry-mulching photos (same filenames, no HTML changes)"
          git push
